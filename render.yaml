# Blueprint de Render: crea el servicio web y la base PostgreSQL de producción.
services:
  - type: web
    name: turnos-consultorio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: turnos-db
          property: connectionString

databases:
  - name: turnos-db
    plan: free
    databaseName: turnos
    user: turnos
